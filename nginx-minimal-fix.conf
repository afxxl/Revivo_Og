# This is a minimal fix to add to your existing NGINX configuration
# Add these lines inside your 'location /' block in /etc/nginx/sites-available/default

# Inside your location / block, add these lines:
location / {
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    
    # Critical for session cookies - add these lines
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    
    # Cookie handling for sessions - add these lines
    proxy_cookie_path / /;
    proxy_cookie_domain localhost www.revivo.live;
}
