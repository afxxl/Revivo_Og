server {
    listen 80;
    server_name revivo.live www.revivo.live;

    # Redirect all HTTP requests to HTTPS with www
    return 301 https://www.revivo.live$request_uri;
}

server {
    listen 443 ssl;
    server_name revivo.live;

    # SSL configuration managed by Certbot
    ssl_certificate /etc/letsencrypt/live/revivo.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revivo.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect revivo.live to www.revivo.live
    if ($host = revivo.live) {
        return 301 https://www.revivo.live$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.revivo.live;

    # SSL configuration managed by Certbot
    ssl_certificate /etc/letsencrypt/live/revivo.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revivo.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory from your old config
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to Node.js app on localhost:3000
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Critical for session cookies
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Cookie handling for sessions
        proxy_cookie_path / /;
        proxy_cookie_domain localhost www.revivo.live;
        
        # Buffering settings for better performance
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Deny access to sensitive files
    location ~ \.(env|log|git|gitignore|md|yml|yaml|lock)$ {
        deny all;
        return 403;
    }

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
