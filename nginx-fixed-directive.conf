# Corrected NGINX configuration

# The error was in the proxy_cookie_domain directive
# The correct syntax is:

proxy_cookie_path / /;
proxy_cookie_domain revivo.live www.revivo.live;

# Full location block should look like this:
location / {
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    
    # Critical for session cookies
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    
    # Corrected cookie handling for sessions
    proxy_cookie_path / /;
    proxy_cookie_domain revivo.live www.revivo.live;
}
